name = "OBD"
version = "0.1.1"
description = "OBD-II scan tool over CAN (ISO 15765-4) or DoIP: live PIDs, stored, pending and permanent DTCs, freeze frame, readiness monitors, VIN and a confirm-gated DTC clear. J1979 and J1979-2; demo vehicle included."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-obd"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["obd", "obd-ii", "j1979", "obdonuds", "automotive", "diagnostics", "can", "doip", "obd2", "obdii", "obd ii", "obd on uds", "j1979-2", "iso 15031", "iso 15765", "iso 13400", "scan tool", "pid", "dtc", "check engine"]
categories = ["Automotive", "Diagnostics"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_obd"]
