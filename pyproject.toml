[project]
name = "zelos-extension-obd"
version = "0.1.0"
description = "OBD-II scan tool extension for Zelos"
authors = [{ name = "Zelos", email = "info@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "obd", "obd-ii", "j1979", "diagnostics", "automotive", "can", "doip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.12",
    "rich-click>=1.8.0",
    # CAN bus runtime (`zelos_can.bus`), the diagnostics transports `zelos_can.isotp` and
    # `zelos_can.doip` (extra `diag`) and the PID catalogue `zelos_can.obd`.
    # TODO floor: the first zelos-can release with `zelos_can.isotp.QuietStack`.
    "zelos-can[python-can,diag]>=0.0.11a5",
    # NRC names in results.
    "udsoncan>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-obd"
Repository = "https://github.com/zeloscloud/zelos-extension-obd"
Issues = "https://github.com/zeloscloud/zelos-extension-obd/issues"
Documentation = "https://docs.zeloscloud.io/extensions"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
    "jsonschema>=4.0.0",
    # The vendored conformance suite (tests/conformance) imports these.
    "cantools>=41.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_obd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100
# Vendored as is from zelos-examples / the zelos monorepo; edited there.
extend-exclude = ["tests/conformance/testing", "tests/fixtures/obd/obd_*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
