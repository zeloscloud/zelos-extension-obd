[project]
name = "zelos-extension-obd"
version = "0.1.1"
description = "OBD-II scan tool over CAN (ISO 15765-4) or DoIP: live PIDs, stored, pending and permanent DTCs, freeze frame, readiness monitors, VIN and a confirm-gated DTC clear. J1979 and J1979-2; demo vehicle included."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "obd", "obd-ii", "j1979", "diagnostics", "automotive", "can", "doip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "rich-click>=1.8.0",
    # Extra `diag`: the ISO-TP and DoIP transports.
    "zelos-can[python-can,diag]>=0.0.11a13",
    # NRC names in results.
    "udsoncan>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-obd"
Repository = "https://github.com/zeloscloud/zelos-extension-obd"
Issues = "https://github.com/zeloscloud/zelos-extension-obd/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_obd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]
